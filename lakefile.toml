name = "yang-mills-lean"
version = "1.2.0"
defaultTargets = ["GaugeCertificates", "CrossTheorem"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

# The original modules retain their source bytes; the new sign-transfer module is registered here.
[[lean_lib]]
name = "GaugeCertificates"

[[lean_lib]]
name = "CrossTheorem"
roots = ["CrossTheorem", "MatrixResolvedBoundary", "SchurCongruence", "ProjectorKernel", "CouplingFeedback", "ObservabilityKernel", "ProjectorDynamics", "TailGapTransfer", "SchurFloorTransfer", "NonuniformAllocationFloor", "LongestYangMillsChain", "SchurInertiaComparison", "SchurInertiaCount", "WindowWall", "WindowWallDeriv", "WindowWallFinite", "WindowWallMono", "WindowWallCells", "OneLinkTailFloor", "TailFloor", "TailFloorDoubleCube", "GaugeSupport", "GaugeSupportFDRep", "GaugeSupportLattice", "DualSimple", "WindowWallJensen", "SmallSupportCycle", "ThetaFloor", "ThetaTriality", "TransferGap", "KyFanChord", "CutBound", "SmallSupportBridge", "CutFlux", "TrialityVertex", "GaugeSupportRegroup", "CentreCharacterSU3", "GaugeSupportReshuffle", "IrrepEmbedSU3", "NtListSupport", "ThetaFloorTriality"]
